<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discontinued Products | Bye or Back</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/discontinued.css" />
  </head>
  <body>
    <div class="container">
      <header class="py-3">
        <h1>Bye or Back</h1>
        <nav aria-label="Main navigation">
          <a href="seasonal.html">Seasonal Products</a> |
          <a href="discontinued.html" aria-current="page">
            Discontinued Products
          </a>
        </nav>
      </header>

      <main>
        <div id="messages"></div>

        <div class="row">
          <section class="col-md-8" aria-labelledby="list-title">
            <h2 id="list-title">Discontinued Products</h2>
            <form id="formSearch" role="search" class="mb-2">
              <label for="query" class="form-label">
                Search by name or brand
              </label>
              <input
                id="query"
                name="query"
                type="search"
                class="form-control"
              />
            </form>
            <p id="total" class="text-body-secondary"></p>
            <div id="products"></div>
            <nav aria-label="Product pages">
              <ul class="pagination flex-wrap" id="pagination"></ul>
            </nav>
          </section>

          <section class="col-md-4 report-panel" aria-labelledby="form-title">
            <h2 id="form-title">Report a product</h2>
            <form id="formProduct">
              <div class="mb-2">
                <label for="name" class="form-label">Product name</label>
                <input
                  id="name"
                  name="name"
                  class="form-control"
                  required
                  maxlength="120"
                />
              </div>
              <div class="mb-2">
                <label for="brand" class="form-label">Brand</label>
                <input
                  id="brand"
                  name="brand"
                  class="form-control"
                  required
                  maxlength="80"
                />
              </div>
              <div class="mb-2">
                <label for="category" class="form-label">Category</label>
                <input
                  id="category"
                  name="category"
                  class="form-control"
                  maxlength="80"
                />
              </div>
              <div class="mb-2">
                <label for="discontinuedDate" class="form-label">
                  Discontinued on
                </label>
                <input
                  id="discontinuedDate"
                  name="discontinuedDate"
                  type="date"
                  class="form-control"
                />
              </div>
              <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea
                  id="notes"
                  name="notes"
                  class="form-control"
                  rows="3"
                  maxlength="500"
                ></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="reset" class="btn btn-outline-secondary">
                Clear
              </button>
            </form>
          </section>
        </div>
      </main>

      <footer class="py-3">Bye or Back, discontinued products</footer>
    </div>

    <script type="module" src="./js/discontinued.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
