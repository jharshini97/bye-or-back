
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seasonal Products | Bye or Back</title>

</head>

<body>
  <header>
    <h1>Bye or Back</h1>
    <nav aria-label="Main navigation">
      <a href="seasonal.html" aria-current="page">
        Seasonal Products
      </a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="page-title">
      <h2 id="page-title">Seasonal Products</h2>
      <p>Discover your favorite seasonal grocery products!</p>

      <label for="product-search">Search by name or brand</label>
      <input
        type="search"
        id="product-search"
        placeholder="Search products..."
      >
    </section>

    <section aria-labelledby="in-season-title">
      <h2 id="in-season-title">Typically in Season</h2>
      
    <div class="month-navigation">
    <button type="button" id="previous-month">
        &larr; Previous
    </button>

    <button type="button" id="next-month">
        Next &rarr;
    </button>
    </div>


      <p>Seasonal availability is estimated and may vary by store.</p>
      <div id="seasonal-products"></div>
    </section>

    <section aria-labelledby="upcoming-title">
      <h2 id="upcoming-title">Coming Back Next</h2>
      <div id="upcoming-products"></div>
    </section>
  </main>

  <footer>
    <p>Bye or Back — Discover what's in season.</p>
  </footer>
  <script type="module" src="js/seasonal.js"></script>
</body>
</html>
